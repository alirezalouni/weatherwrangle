  <line x1="80" y1="284.0" x2="720" y2="284.0" class="grid" stroke-dasharray="2,2"/>
  <text x="70" y="288.0" text-anchor="end" class="grid-text">6,354</text>
  <line x1="80" y1="216.0" x2="720" y2="216.0" class="grid" stroke-dasharray="2,2"/>
  <text x="70" y="220.0" text-anchor="end" class="grid-text">9,531</text>
  <line x1="80" y1="148.0" x2="720" y2="148.0" class="grid" stroke-dasharray="2,2"/>
  <text x="70" y="152.0" text-anchor="end" class="grid-text">12,708</text>
  <line x1="80" y1="80.0" x2="720" y2="80.0" class="grid" stroke-dasharray="2,2"/>
